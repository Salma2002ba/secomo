# Point d'entrée unique (Traefik, inclus dans k3s), exposé sur http://localhost:8081
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secomo
  namespace: secomo
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8000 } }
          - path: /docs
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8000 } }
          - path: /openapi.json
            pathType: Exact
            backend:
              service: { name: backend, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }

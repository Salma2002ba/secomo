# Configuration de Jenkins décrite en code : compte admin, sécurité et job du pipeline
jenkins:
  systemMessage: "SECOMO : pipeline CI/CD vers Kubernetes"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

jobs:
  - script: |
      pipelineJob('secomo') {
        description('Tests, build, scan, déploiement sur Kubernetes et tests contre le cluster')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('H/2 * * * *') } // pas de webhook possible en local
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Salma2002ba/secomo.git') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
